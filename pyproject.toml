[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sstonet"
version = "0.1.0"
description = "Topology-aware operator learning for satellite steady-state temperature fields"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang Xu"}]
keywords = ["operator learning", "DeepONet", "graph neural network", "thermal analysis", "satellite"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "torch>=2.6",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tensorboard = ["tensorboard>=2.15"]

[project.urls]
Repository = "https://github.com/Ne1ther/SSTONet"
Paper = "https://doi.org/10.1016/j.ast.2026.114015"
"NXOpen companion" = "https://github.com/Ne1ther/NXOpen_satellite"

[tool.setuptools.packages.find]
include = ["sstonet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
