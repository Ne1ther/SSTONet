# Principal model configuration. Paths are relative to the repository root.
data:
  root: data
  result_subdir: nx_exports
  n_samples: 5000
  graph_dir: data/graph
  include_radiation: true
  radiation_pca_dim: 0
model:
  branch_hidden:
  - 512
  - 512
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  num_slices: 64
  mlp_ratio: 2
  use_component_features: true
  use_radius_features: true
  use_bbox_features: true
  activation: gelu
  use_layer_norm: true
  dropout: 0.0
  initializer: glorot_uniform
training:
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  epochs: 300
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
  device: auto
  verbose: true
  split_seed: 42
  deterministic_algorithms: false
