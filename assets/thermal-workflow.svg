<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="208" viewBox="0 0 1120 208" role="img" aria-labelledby="title desc">
  <title id="title">Two repositories, one thermal workflow</title>
  <desc id="desc">NXOpen Satellite automates simulation and exports cases. SSTONet learns from those cases and predicts temperature fields. A smiling CSV packet connects the two toolboxes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#b99550" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="10" y="14" width="430" height="178" rx="14" fill="#f5f4ee" stroke="#dce2d8"/>
  <rect x="680" y="14" width="430" height="178" rx="14" fill="#e6eee5" stroke="#c7d9cc"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="34" y="45" fill="#64776c" font-size="11" letter-spacing="2">01 / SIMULATE</text>
    <text x="34" y="87" fill="#173a36" font-size="28" font-weight="700">NXOpen_satellite</text>
    <text x="34" y="117" fill="#46615b" font-size="14">Parameters, batch solves, reference exports.</text>
    <text x="34" y="170" fill="#657771" font-size="12">Windows · Siemens NX / Simcenter 3D</text>
    <text x="704" y="45" fill="#64776c" font-size="11" letter-spacing="2">02 / LEARN</text>
    <text x="704" y="87" fill="#173a36" font-size="28" font-weight="700">SSTONet</text>
    <text x="704" y="117" fill="#46615b" font-size="14">Graph-aware training, full-field prediction.</text>
    <text x="704" y="170" fill="#657771" font-size="12">Python 3.14.4 · PyTorch 2.11.0</text>
  </g>
  <path d="M452 102H505M609 102H668" fill="none" stroke="#b99550" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke-linejoin="round">
    <path d="M525 49H572L595 72V148H525Z" fill="#fffdf7" stroke="#8fa798" stroke-width="1.5"/>
    <path d="M572 49V72H595" fill="#f5ecd8" stroke="#8fa798" stroke-width="1.5"/>
    <circle cx="547" cy="96" r="3.1" fill="#26796d"/>
    <circle cx="573" cy="96" r="3.1" fill="#26796d"/>
    <path d="M547 107Q560 118 573 107" fill="none" stroke="#26796d" stroke-width="2" stroke-linecap="round"/>
    <text x="560" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="#64776c">CSV</text>
  </g>
  <text x="560" y="178" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#7b8879">hello, thermal world</text>
</svg>
